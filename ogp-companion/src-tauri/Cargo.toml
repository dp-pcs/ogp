[package]
name = "ogp-companion"
version = "0.1.4"
description = "OGP Companion — desktop UI for the OGP federation gateway"
authors = ["David Proctor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ogp_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
