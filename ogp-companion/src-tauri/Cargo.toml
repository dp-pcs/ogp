[package]
name = "ogp-companion"
version = "0.3.2"
description = "OGP Companion — desktop UI for the OGP federation gateway"
authors = ["David Proctor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ogp_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bd-mmx7: in-app auto-update. updater checks/downloads/installs signed bundles;
# process provides relaunch() to restart into the new version after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
